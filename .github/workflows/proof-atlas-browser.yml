name: Proof Atlas browser regression
on:
  push:
    branches: [master]
    paths:
      - 'public/js/proof-atlas.js'
      - 'public/js/proof-atlas-reader.js'
      - 'public/js/proof-atlas-term-reader.js'
      - 'public/js/proof-atlas-application-*.js'
      - 'scripts/test-proof-atlas-applications*.cjs'
      - 'scripts/test-proof-atlas-application-geometry*.cjs'
      - 'public/js/proof-atlas-article-index.js'
      - 'public/js/proof-atlas-article.js'
      - 'public/js/proof-atlas-sync.js'
      - 'public/js/proof-atlas-geometry-core.js'
      - 'scripts/test-proof-atlas-geometry*.cjs'
      - 'scripts/test-proof-atlas-telescope*.cjs'
      - 'scripts/test-proof-atlas-sync.cjs'
      - '_includes/proof-atlas-compiled-workspace.html'
      - '_includes/proof-atlas-reading-tools.html'
      - 'public/js/proof-atlas-proof-step-index.js'
      - 'scripts/test-proof-atlas-proof-steps*.cjs'
      - 'public/data/proof-atlas/article-proof-steps.js'
      - 'public/research/se2/article-figures/**'
      - 'public/research/se2/article-references.bib'
      - 'scripts/test-proof-atlas-distill.cjs'
      - 'public/data/proof-atlas/crossing-article-index.js'
      - 'public/data/proof-atlas/crossing-article-lines.js'
      - 'public/data/proof-atlas/article-coverage.js'
      - 'scripts/test-proof-atlas-article-columns.cjs'
      - 'scripts/test-proof-atlas-coverage.cjs'
      - 'public/research/se2/conjugate_times_se2.*'
      - 'public/data/proof-atlas/crossing-terms.js'
      - 'scripts/test-proof-atlas-subtree.cjs'
      - 'scripts/test-proof-atlas-decoder.cjs'
      - 'public/js/proof-atlas-grammar.js'
      - 'public/js/proof-atlas-scales.js'
      - 'public/data/proof-atlas/lean-expr-grammar.js'
      - 'public/data/proof-atlas/lean-syntax-reference.js'
      - 'scripts/test-proof-atlas-reference.cjs'
      - 'public/css/**'
      - '_layouts/**'
      - '_includes/head.html'
      - 'research/proof-atlas/**'
      - 'projects/proof-atlas/**'
      - 'scripts/test-research-navigation.cjs'
      - '_data/research.yml'
      - '_data/series.yml'
      - 'lab.html'
      - 'index.html'
      - 'projects.markdown'
      - '_includes/research-highlights.html'
      - '_includes/proof-atlas-nav.html'
      - '_includes/proof-atlas-reading-tools.html'
      - 'scripts/test-proof-atlas-browser.cjs'
      - 'scripts/test-proof-atlas-grammar.cjs'
      - '.github/workflows/proof-atlas-browser.yml'
  pull_request:
    paths:
      - 'scripts/test-research-navigation.cjs'
      - '_data/research.yml'
      - '_data/series.yml'
      - 'lab.html'
      - 'index.html'
      - 'projects.markdown'
      - '_includes/research-highlights.html'
      - '_includes/proof-atlas-nav.html'
      - '_includes/proof-atlas-reading-tools.html'
      - 'public/**/proof-atlas*'
      - 'public/css/**'
      - '_layouts/**'
      - '_includes/head.html'
      - 'research/proof-atlas/**'
      - 'public/data/proof-atlas/**'
      - 'projects/proof-atlas/**'
      - 'scripts/test-proof-atlas*.cjs'
      - '.github/workflows/proof-atlas-browser.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all exact constant references and application spines
        run: node scripts/test-proof-atlas-applications.cjs
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save playwright@1.57.0 axe-core@4.11.0
          browserPath="$(command -v google-chrome || true)"
          if [ -n "$browserPath" ]; then
            echo "ATLAS_CHROMIUM_PATH=$browserPath" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: Install locked website dependencies for the runner platform
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4 --retry 3
      - name: Build and serve the actual website with its global styles
        run: |
          bundle exec jekyll build --destination _site_production
          python3 -m http.server 8833 --bind 127.0.0.1 --directory _site_production > /tmp/proof-atlas-server.log 2>&1 &
          sleep 2
      - name: Verify exact named-application navigation on production pages
        run: node scripts/test-proof-atlas-applications-browser.cjs
        env:
          ATLAS_SCREENSHOTS: /tmp/proof-atlas-browser
      - name: Research and tool reading journeys
        run: node scripts/test-research-navigation.cjs
        env:
          ATLAS_SCREENSHOTS: /tmp/proof-atlas-browser
      - name: Browser regression — hub hover, geometry, responsiveness
        run: node scripts/test-proof-atlas-browser.cjs
        env:
          ATLAS_SCREENSHOTS: /tmp/proof-atlas-browser
      - name: Verify actual-term decoder and selected subtree browser
        run: |
          node scripts/test-proof-atlas-decoder.cjs
          node scripts/test-proof-atlas-subtree.cjs
          node scripts/test-proof-atlas-article-index.cjs
          node scripts/test-proof-atlas-article-browser.cjs
          python3 research/proof-atlas/verify_distill_article.py
          python3 research/proof-atlas/verify_article_coverage.py
          node scripts/test-proof-atlas-distill.cjs
          node scripts/test-proof-atlas-article-columns.cjs
          node scripts/test-proof-atlas-coverage.cjs
          node scripts/test-proof-atlas-library.cjs
          node scripts/test-proof-atlas-sync.cjs
          node scripts/test-proof-atlas-application-geometry.cjs
          node scripts/test-proof-atlas-application-geometry-browser.cjs
          node scripts/test-proof-atlas-telescope.cjs
          node scripts/test-proof-atlas-telescope-browser.cjs
          node scripts/test-proof-atlas-geometry-core.cjs
          node scripts/test-proof-atlas-geometry-browser.cjs
          node scripts/test-proof-atlas-proof-steps.cjs
          node scripts/test-proof-atlas-proof-steps-browser.cjs
        env:
          ATLAS_SCREENSHOTS: /tmp/proof-atlas-browser
      - name: Browser regression — complete Lean.Expr visual grammar
        run: node scripts/test-proof-atlas-grammar.cjs
        env:
          ATLAS_SCREENSHOTS: /tmp/proof-atlas-browser
      - name: Browser regression — scoped Lean reference and accessibility
        run: node scripts/test-proof-atlas-reference.cjs
        env:
          ATLAS_SCREENSHOTS: /tmp/proof-atlas-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-atlas-browser-screenshots
          path: /tmp/proof-atlas-browser

  lean-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean compiler
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
      - name: Check reference fields, source examples and small kernel terms
        run: python3 research/proof-atlas/verify_lean_reference.py --lean "$HOME/.elan/bin/lean"
      - name: Audit the unchanged public graph topology
        run: python3 research/proof-atlas/verify_public_data.py

  lean-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean compiler
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
      - name: Check reference fields, source examples and small kernel terms
        run: python3 research/proof-atlas/verify_lean_reference.py --lean "$HOME/.elan/bin/lean"
      - name: Kernel-check context projection laws and regenerate bridge fixtures
        run: |
          theory_prefix="$("$HOME/.elan/bin/lean" --print-prefix)"
          python3 research/proof-atlas/context-projection/verify.py --lean "$theory_prefix/bin/lean" --workdir "$RUNNER_TEMP/atlas-projection-theory" --check
      - name: Kernel-check exact context support and regenerate summaries
        run: |
          support_prefix="$("$HOME/.elan/bin/lean" --print-prefix)"
          python3 research/proof-atlas/context-projection/verify_support.py --lean "$support_prefix/bin/lean" --workdir "$RUNNER_TEMP/atlas-projection-support" --check
      - name: Kernel-check least context closure and regenerate dependency fixtures
        run: |
          closure_prefix="$("$HOME/.elan/bin/lean" --print-prefix)"
          python3 research/proof-atlas/context-closure/verify.py --lean "$closure_prefix/bin/lean" --workdir "$RUNNER_TEMP/atlas-context-closure" --check
      - name: Audit the unchanged public graph topology
        run: python3 research/proof-atlas/verify_public_data.py

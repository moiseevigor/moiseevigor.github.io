jobs:
  public-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/proof-atlas/verify_proof_library.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-proof-atlas-occurrence-types.cjs
      - run: node scripts/test-proof-atlas-type-sharing.cjs
      - run: node scripts/test-proof-atlas-type-geometry.cjs
      - run: node scripts/test-proof-atlas-type-conversions.cjs
      - run: node scripts/test-proof-atlas-application-judgments.cjs
      - run: node scripts/test-proof-atlas-lambda-judgments.cjs
      - run: node scripts/test-proof-atlas-beta-reductions.cjs
      - run: node scripts/test-proof-atlas-elimination.cjs
      - run: node scripts/test-proof-atlas-recursive-inputs.cjs
      - run: node scripts/test-proof-atlas-recursion-examples.cjs
      - run: node scripts/test-proof-atlas-ai-sample.cjs
      - run: node scripts/test-proof-atlas-binding-uses.cjs
      - run: node scripts/test-proof-atlas-let-reductions.cjs
      - run: node scripts/test-proof-atlas-let-premises.cjs
      - run: node scripts/test-proof-atlas-let-pools.cjs
  constructor-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Lean compiler
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run synthetic constructor and sharing controls without project proofs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research/proof-atlas')
          source=(p/'ExportLibrary.lean').read_text().replace('import SE2Conjugate','')
          controls=(p/'LibraryControls.lean').read_text().replace('import ExportLibrary','')
          Path('/tmp/AtlasNativeControls.lean').write_text(source+'\n'+controls)
          PY
          lean /tmp/AtlasNativeControls.lean
      - name: Check exact occurrence types and reject a changed packet
        run: python3 research/proof-atlas/verify_occurrence_type_controls.py --reserve-gib 5
      - name: Check raw-kernel beta composition and independent substitution
        run: python3 research/proof-atlas/verify_beta_controls.py --reserve-gib 5
      - name: Check native recursor rules, forwarding and branch contexts
        run: python3 research/proof-atlas/verify_elimination_controls.py
      - name: Rebuild bounded recursive controls and compare native expressions
        run: |
          python3 research/proof-atlas/build_recursion_examples.py --workdir /tmp/AtlasRecursionExamples --reserve-gib 5
          node scripts/test-proof-atlas-recursion-examples.cjs /tmp/AtlasRecursionExamples
      - name: Check native lexical support, scope boundaries and declared-type conversion
        run: python3 research/proof-atlas/verify_binding_uses_controls.py --reserve-gib 5
      - name: Check fresh native let substitution, dependent types and proof irrelevance
        run: python3 research/proof-atlas/verify_let_controls.py --reserve-gib 5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover the fixed sample from the pinned official release
        run: |
          python -m pip install --no-deps pyarrow==19.0.1
          curl --fail --location --retry 3 --max-time 120 --max-filesize 33554432 https://huggingface.co/datasets/Goedel-LM/Lean-workbook-proofs/resolve/b731852af8d8ab11498fda27bce9020738c01c59/data/train-00000-of-00001.parquet --output /tmp/atlas-goedel.parquet
          python research/proof-atlas/prepare_goedel_sample.py --parquet /tmp/atlas-goedel.parquet --output /tmp/atlas-goedel-selected.json
          python - <<'PYCONTROL'
          import json, sys
          sys.path.insert(0, 'research/proof-atlas')
          from evaluate_goedel import review_source
          rows=json.load(open('/tmp/atlas-goedel-selected.json'))
          for row in rows: review_source(row)
          print('All 24 exact released source scripts satisfy the reviewed command policy.')
          PYCONTROL

name: Proof Atlas scope comparison
on:
  push:
    paths:
      - 'public/js/proof-atlas-scope-comparison.js'
      - 'public/js/proof-atlas-application-ports.js'
      - 'public/js/proof-atlas-paged-type-operations.js'
      - 'research/proof-atlas/scope-comparison/**'
      - 'research/proof-atlas/formal-support/**'
      - 'research/proof-atlas/type-sharing/**'
      - 'research/proof-atlas/clause-navigation/**'
      - 'public/js/proof-atlas-clause-navigation.js'
      - 'public/js/proof-atlas-type-sharing*.js'
      - 'public/js/proof-atlas-application-type-pages.js'
      - 'public/data/proof-atlas/formal-support-controls-manifest.js'
      - '.github/workflows/proof-atlas-scope-comparison.yml'
  pull_request:
    paths:
      - 'public/js/proof-atlas-scope-comparison.js'
      - 'public/js/proof-atlas-application-ports.js'
      - 'public/js/proof-atlas-paged-type-operations.js'
      - 'research/proof-atlas/scope-comparison/**'
      - 'research/proof-atlas/formal-support/**'
      - 'research/proof-atlas/type-sharing/**'
      - 'research/proof-atlas/clause-navigation/**'
      - 'public/js/proof-atlas-clause-navigation.js'
      - 'public/js/proof-atlas-type-sharing*.js'
      - 'public/js/proof-atlas-application-type-pages.js'
      - 'public/data/proof-atlas/formal-support-controls-manifest.js'
      - '.github/workflows/proof-atlas-scope-comparison.yml'
jobs:
  scope-certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check formal evidence identities and candidate runtime records
        run: node research/proof-atlas/scope-comparison/check-evidence.cjs --runtime
      - name: Replay complete and paged scope controls
        run: node --max-old-space-size=256 research/proof-atlas/scope-comparison/check-runtime.cjs /tmp/scope-runtime.json
      - name: Check recorded kernel controls and replay native scope comparisons
        run: |
          node research/proof-atlas/scope-comparison/native/check-evidence.cjs
          node --max-old-space-size=256 research/proof-atlas/scope-comparison/native/check.cjs /tmp/scope-native.json
      - name: Check exact formal references and compiled application views
        run: |
          node research/proof-atlas/formal-support/check-evidence.cjs
          node --max-old-space-size=256 research/proof-atlas/formal-support/check.cjs /tmp/formal-support.json
          node research/proof-atlas/formal-support/publish.cjs --check
          node --max-old-space-size=256 research/proof-atlas/formal-support/check-views.cjs /tmp/formal-support-views.json
      - name: Check parameterized recorded-type sharing
        run: |
          node research/proof-atlas/type-sharing/check-evidence.cjs
          node --max-old-space-size=256 research/proof-atlas/type-sharing/check-model.cjs /tmp/type-sharing-model.json
          node --max-old-space-size=256 research/proof-atlas/type-sharing/check-corpus.cjs /tmp/type-sharing-corpus.json
      - name: Reproduce statement and use links from compiled packets
        run: |
          dir=research/proof-atlas/clause-navigation
          node "$dir/check.cjs" > /tmp/clause-witnesses.json
          node "$dir/census.cjs" | diff "$dir/census.json" -
          node "$dir/use-census.cjs" /tmp/clause-witnesses.json | diff "$dir/use-census.json" -
          node "$dir/use-positions.cjs" < /tmp/clause-witnesses.json | diff "$dir/use-positions.json" -
          node "$dir/check-paged.cjs" 1 > /tmp/clause-one-page.json
          node "$dir/check-paged.cjs" 2 > /tmp/clause-two-pages.json
          node -e "require('node:assert/strict').deepEqual(require('./$dir/paged-comparison.json'), {onePage:require('/tmp/clause-one-page.json'), twoPages:require('/tmp/clause-two-pages.json')})"
          node "$dir/riccati.cjs" < /tmp/clause-witnesses.json | diff "$dir/riccati.html" -
          node "$dir/projection-example.cjs" | diff "$dir/projection-example.html" -
      - uses: actions/upload-artifact@v4
        with:
          name: proof-atlas-scope-runtime
          path: |
            /tmp/scope-runtime.json
            /tmp/scope-native.json
            /tmp/formal-support.json
            /tmp/formal-support-views.json
            /tmp/type-sharing-model.json
            /tmp/type-sharing-corpus.json

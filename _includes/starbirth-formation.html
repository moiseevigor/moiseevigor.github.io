      <h4 id="sbf-title">Molecular cloud</h4>
      <p id="sbf-description">Cold molecular gas and a small dust component gather into denser regions. Some regions become gravitationally unstable; others disperse.</p>
      <dl>
        <div><dt>What changes</dt><dd id="sbf-change">Dense structures develop inside the cloud.</dd></div>
        <div><dt>Energy &amp; support</dt><dd id="sbf-energy">Thermal pressure, turbulence and magnetic fields compete with gravity.</dd></div>
        <div><dt>What a telescope sees</dt><dd id="sbf-observe">Dust emission and molecular spectral lines; no central stellar object yet.</dd></div>
      </dl>

  <figcaption>A single low-mass pathway, with changing visual zoom. Real clouds can fragment into multiple stars. Class 0–III labels describe observed spectra and can depend on viewing angle; they are not exact ages. Deuterium burning can occur before sustained main-sequence hydrogen burning. The first core and second core are distinct: this research defines birth at <strong>second-core formation</strong>, not at the later main-sequence stage. <a href="https://arxiv.org/abs/2312.03039">Young (2023)</a>, <a href="https://arxiv.org/abs/1602.07314">Furlan et al. (2016)</a>, <a href="https://science.nasa.gov/universe/stars/">NASA: stars</a>.</figcaption>
  <details class="sbf-reading"><summary>Read all nine milestones</summary><ol>
    <li><strong>Molecular cloud.</strong> Gas and dust develop dense regions.</li>
    <li><strong>Collapsing prestellar core.</strong> A bound region contracts; radiation carries away much of its heat.</li>
    <li><strong>First hydrostatic core.</strong> Increasing opacity traps heat, allowing temporary pressure support.</li>
    <li><strong>Second collapse.</strong> Near 2,000 K, molecular hydrogen dissociation allows renewed rapid contraction.</li>
    <li><strong>Embedded protostar.</strong> A second hydrostatic core forms inside an infalling envelope; disks and outflows accompany accretion.</li>
    <li><strong>Envelope clears.</strong> Accretion continues as the surrounding reservoir diminishes.</li>
    <li><strong>Young star with disk.</strong> The envelope has largely dispersed; a disk can still feed the star.</li>
    <li><strong>Disk-poor young star.</strong> The disk disperses and stellar contraction continues.</li>
    <li><strong>Main-sequence star.</strong> Sustained central hydrogen fusion supports a long-lived stellar state.</li>
  </ol></details>

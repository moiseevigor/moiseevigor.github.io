<figure class="l-middle se2-figure se2-overview-figure" data-se2-overview="{{ include.mode }}">
<div class="se2-figure-heading"><span>{{ include.kicker }}</span><h3>{{ include.title }}</h3></div>
<div class="se2-controls">
{% if include.mode == 'motion' %}
<label>Move size ε <input aria-label="Maneuver size" data-param="epsilon" type="range" min="0.05" max="1" step="0.01" value="0.5"><output data-value="epsilon">0.50</output></label>
<label>Sequence progress <input aria-label="Maneuver progress" data-param="progress" type="range" min="0" max="4" step="0.01" value="4"><output data-value="progress">4.00</output></label>
{% elsif include.mode == 'order' %}
<label>Turn angle <input aria-label="Turn angle in degrees" data-param="angle" type="range" min="-180" max="180" step="1" value="60"><output data-value="angle">60°</output></label>
{% elsif include.mode == 'pendulum' %}
<label>Family <select aria-label="Pendulum family" data-param="family"><option value="oscillation">Oscillation</option><option value="rotation" selected>Rotation</option><option value="separatrix">Separatrix</option><option value="custom" disabled>Custom initial velocity</option></select></label>
<label>Initial velocity c <input aria-label="Initial pendulum velocity" data-param="velocity" type="range" min="0" max="4" step="any" value="2.5"><output data-value="velocity">2.50</output></label>
<label>Time <input aria-label="Pendulum time" data-param="time" type="range" min="0" max="10" step="0.02" value="4"><output data-value="time">4.00</output></label>
{% elsif include.mode == 'maxwell' %}
<label>Modulus k <input aria-label="Maxwell modulus" data-param="k" type="range" min="0.3" max="0.94" step="0.01" value="0.75"><output data-value="k">0.75</output></label>
<label>Midpoint phase τ/K <input aria-label="Maxwell midpoint phase in units of K" data-param="midpoint" type="range" min="0.2" max="0.8" step="0.01" value="0.6"><output data-value="midpoint">0.60</output></label>
<label>Travel fraction <input aria-label="Fraction of cut time" data-param="fraction" type="range" min="0" max="1" step="0.005" value="1"><output data-value="fraction">1.00</output></label>
{% endif %}
</div>
<div class="se2-canvas-wrap"><canvas aria-label="{{ include.title }}" role="img"></canvas></div>
<div class="se2-readout" aria-live="polite">Loading the illustration…</div>
<figcaption><span class="figure-label">{{ include.caption }}</span></figcaption>
<noscript>The formulas and explanation above remain available without JavaScript.</noscript>
</figure>

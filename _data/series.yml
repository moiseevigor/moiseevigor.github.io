- id: geometry-of-cosmic-web
  title: "Geometry of the Cosmic Web"
  subtitle: >
    A research program testing whether the orientation-lifted geometry of the
    Geometry of Seeing series can find — and explain — cosmic filaments: a
    scoping document, a benchmark whose corrected verdict favours the simple
    model, and the constructive result the refutations left behind, a measured
    transverse correction to Zel'dovich transport.
  status: complete
  question: "Is the orientation-lifted geometry of visual completion a better instrument for finding cosmic filaments, or even part of the physics that builds them?"
  outcome: "Mostly no — and usefully so. What survived: a cleaner anisotropy descriptor and an unplanned one-rule transport model, brake sideways at the web."

- id: caustics-to-groups
  title: "From Caustics to Groups"
  subtitle: >
    The reverse map: given an observed field of caustics — focusing edges, cusps,
    shell-crossing walls — infer the sub-Riemannian Lie-group geometry that produced
    it. Built around the ADE group-blindness obstruction and the three structure-specific
    observables that escape it: the tangent-cone growth vector, the moduli of the
    conjugate locus at the pole, and the abnormal-geodesic stratum.
  status: complete
  question: "Given an observed field of caustics, can you infer the sub-Riemannian Lie group that produced it?"
  outcome: "Yes on synthetic data — identifiable, discriminable, with a mapped aliasing structure — and calibrated silence where no group exists; gravity turns out to carry no sub-Riemannian structure at all."
  frontier: "Real DW-MRI inference (needs credentialed data)."

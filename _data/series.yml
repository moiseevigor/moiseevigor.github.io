- id: preferred-directions
  title: "The Geometry of Forbidden Directions"
  subtitle: >
    When a physical field forbids a direction of motion — not merely slows it — the
    configuration space becomes sub-Riemannian, and its geometry reads the field. This
    series develops that idea for magnetic fields: the law Q = d + k + 2, a caustic that
    measures the field gradient, and a growth vector that detects magnetic nulls.
  status: active
  question: "Where a physical field forbids a direction of motion, can sub-Riemannian geometry read the field's local structure?"
  outcome: "For magnetic fields, yes: the law Q = d + k + 2 holds in 2D and 3D, and the caustic reads the field gradient — tested on the Sun, Earth's magnetosphere and Jupiter."
  frontier: "Do finer caustic invariants recover the null type (radial vs spiral) the growth vector discards?"
  grew_from: caustics-to-groups
  code: research/preferred-directions/
  verdicts:
    - { h: "Law 2D", v: confirmed, label: "Q = d + k + 2" }
    - { h: "Moduli", v: confirmed, label: "the caustic reads the field gradient" }

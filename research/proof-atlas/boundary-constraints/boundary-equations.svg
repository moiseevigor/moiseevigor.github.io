<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 790" role="group" aria-labelledby="title desc"><title id="title">Dependent boundary equations at a proof join</title><desc id="desc">Two incoming result types define P and Q. The join takes the two propositions and their proofs. Four result positions and all eleven boundary positions remain accounted for; nine are independent and two are computed definitions. Six source links open original compiled occurrences. This is a computed function, not an arbitrary independent replacement of every port.</desc><style>svg{--paper:#fff;--ink:#202124;--muted:#535d68;--line:#697785;--type:#285a86;--pale:#f2f5f8;background:var(--paper)}@media(prefers-color-scheme:dark){svg{--paper:#191b1e;--ink:#eceff2;--muted:#b7c1ca;--line:#9aa9b7;--type:#9bc8ef;--pale:#252a30}}text{fill:var(--ink)}.title{font:26px Georgia,serif}.math{font:21px Georgia,serif}.label{font:15px Arial,sans-serif}.caption{font:15px Arial,sans-serif;fill:var(--muted)}.box{fill:var(--pale);stroke:var(--line);stroke-width:1.4}.derived{stroke:var(--type);stroke-dasharray:3 3}.wire,.type-wire{fill:none;stroke:var(--line);stroke-width:1.8}.type-wire{stroke:var(--type);stroke-dasharray:3 4}a:focus .box,a:hover .box{stroke:var(--type);stroke-width:3}a:focus{outline:2px solid var(--type)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="type-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--type)"/></marker></defs><text x="24" y="36" class="title">Derive boundary propositions from incoming proof types</text>
<text x="24" y="68" class="caption">Checked proofDiamond function: nine independent inputs, two derived ports, no adapter assumptions.</text>
<text x="24" y="105" class="caption">Inputs are interleaved with computations: f, n, u, a, h, v, b, q, g. Both h and q have domains using k.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title description"><title id="title">Typed output tuples across lexical scopes</title><desc id="description">Six Riccati results in context Gamma thirteen retain two local definitions and close one lambda to join a seventh result at Gamma ten. An AI-source result False under two local hypotheses becomes b equals zero implies c equals zero implies False at Gamma eleven. Tuple projection and original instantiation are kernel checked; the tuple does not provide independent boundary assumptions.</desc><style>svg{background:#faf9f6}.paper{fill:#faf9f6}.panel{fill:none;stroke:#c9c7bf}.box{fill:#f2f1ec;stroke:#75756c}.inner{fill:none;stroke:#75756c}.arrow{fill:none;stroke:#343630;stroke-width:1.6}.text,.small,.heading,.title{fill:#252620;font-family:"IBM Plex Sans",Arial,sans-serif}.title{font-size:27px;font-weight:600}.heading{font-size:20px;font-weight:600}.text{font-size:18px}.small{font-size:15px}.formula{fill:#20211d;font-family:"STIX Two Math","Source Serif 4",Georgia,serif;font-size:25px}.slot{fill:#fff;stroke:#8b8b80}.number{font:16px monospace;fill:#20211d}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#343630"/></marker></defs><rect class="paper" width="1000" height="710"/><text x="26" y="35" class="title">Typed output tuples across lexical scopes</text><text x="26" y="62" class="small">Source occurrences and computed ports retain separate addresses.</text><rect x="20" y="82" width="960" height="282" rx="5" class="panel"/><text x="40" y="111" class="heading">Riccati bound · seven selected results</text><rect x="40" y="132" width="390" height="108" rx="4" class="box"/><text x="56" y="160" class="heading">Original Γ13 · six result occurrences</text><text x="56" y="187" class="text">25, 26, 27, 76, 77, 78</text><text x="56" y="218" class="small">Suffix: two let definitions and one λ binder</text><rect x="40" y="260" width="390" height="74" rx="4" class="box"/><text x="56" y="287" class="heading">Original Γ10 · result 75</text><text x="56" y="313" class="small">No local suffix to close</text><path d="M 430 188 H 575" marker-end="url(#arrow)" class="arrow"/><text x="449" y="176" class="small">close suffix</text><path d="M 430 296 H 575" marker-end="url(#arrow)" class="arrow"/><text x="449" y="284" class="small">identity</text><rect x="585" y="132" width="375" height="202" rx="4" class="box"/><rect x="589" y="136" width="367" height="194" rx="2" class="inner"/><text x="602" y="164" class="heading">One checked output tuple in Γ10</text><text x="602" y="193" class="small">PProd of seven closed result types</text><rect x="602" y="220" width="42" height="42" rx="2" class="slot"/><text x="611" y="247" class="number">25</text><rect x="650" y="220" width="42" height="42" rx="2" class="slot"/><text x="659" y="247" class="number">26</text><rect x="698" y="220" width="42" height="42" rx="2" class="slot"/><text x="707" y="247" class="number">27</text><rect x="746" y="220" width="42" height="42" rx="2" class="slot"/><text x="755" y="247" class="number">75</text><rect x="794" y="220" width="42" height="42" rx="2" class="slot"/><text x="803" y="247" class="number">76</text><rect x="842" y="220" width="42" height="42" rx="2" class="slot"/><text x="851" y="247" class="number">77</text><rect x="890" y="220" width="42" height="42" rx="2" class="slot"/><text x="899" y="247" class="number">78</text><text x="602" y="290" class="small">Ordered ports keep all seven source identities</text><text x="602" y="316" class="small">Let values remain definitions, not new inputs</text><rect x="20" y="389" width="960" height="231" rx="5" class="panel"/><text x="40" y="420" class="heading">AI-source proof · one of eight checked output ports</text><rect x="40" y="445" width="390" height="120" rx="4" class="box"/><text x="56" y="477" class="heading">Original Γ13 · local branch result</text><text x="56" y="511" class="formula">False</text><text x="56" y="544" class="small">Additional hypotheses: b = 0, c = 0</text><path d="M 430 502 H 575" marker-end="url(#arrow)" class="arrow"/><text x="449" y="490" class="small">λ-close two</text><rect x="585" y="445" width="375" height="120" rx="4" class="box"/><rect x="589" y="449" width="367" height="112" rx="2" class="inner"/><text x="602" y="477" class="heading">Computed result type in Γ11</text><text x="602" y="515" class="formula">b = 0 → c = 0 → False</text><text x="602" y="544" class="small">It does not assert False at the shared prefix</text><text x="40" y="598" class="small">Eight closure values form one PProd tuple at this same Γ11.</text><text x="26" y="657" class="text">Projection + original arguments: kernel conversion back to each source result.</text><text x="26" y="688" class="small">These are typed output collections; no independent region-boundary function is claimed.</text></svg>

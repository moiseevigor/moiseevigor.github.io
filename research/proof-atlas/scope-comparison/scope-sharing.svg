<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title description">
<title id="title">Uniform context extension preserves local binder references</title>
<desc id="description">One stored source variable e0 is reached directly at depth zero and through a lambda body at depth one. Extension by one maps the first occurrence to bvar one and preserves the second as bvar zero. The two paired rows retain different target rows and depth ranges; storage reuse does not identify occurrences.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677a"/></marker></defs>
<rect width="1120" height="520" fill="#faf9f6"/>
<text x="36" y="35" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#18232f">Same storage row, different scope paths</text>
<text x="36" y="65" font-family="system-ui, sans-serif" font-size="17" fill="#424c57">Authored syntax control · uniform external-context extension +1 · no typing claim</text>
<path d="M555 90V340" stroke="#ccd0d5"/>
<text x="36" y="110" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#18232f">Original graph</text>
<text x="590" y="110" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#18232f">Lifted graph</text>
<path d="M190 170L125 285" fill="none" stroke="#53677a" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="218" font-family="system-ui, sans-serif" font-size="17" fill="#334a60">fn · depth 0</text>
<path d="M300 170L355 210" fill="none" stroke="#53677a" stroke-width="2" marker-end="url(#arrow)"/><text x="327" y="190" font-family="system-ui, sans-serif" font-size="17" fill="#334a60">arg</text>
<path d="M310 254Q230 280 190 290" fill="none" stroke="#53677a" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="269" font-family="system-ui, sans-serif" font-size="17" fill="#334a60">body · +1 binder</text>
<path d="M410 254L465 290" fill="none" stroke="#53677a" stroke-width="2" marker-end="url(#arrow)"/><text x="440" y="270" font-family="system-ui, sans-serif" font-size="17" fill="#334a60">domain · +0</text>
<rect x="155" y="126" width="180" height="44" rx="5" fill="#fff" stroke="#424c57" stroke-width="1.5"/><text x="245" y="154" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#18232f">e3: app</text><rect x="280" y="210" width="160" height="44" rx="5" fill="#fff" stroke="#424c57" stroke-width="1.5"/><text x="360" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#18232f">e2: lam</text><rect x="48" y="290" width="180" height="44" rx="5" fill="#fff" stroke="#424c57" stroke-width="1.5"/><text x="138" y="318" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#18232f">e0: bvar 0</text><rect x="430" y="290" width="100" height="44" rx="5" fill="#fff" stroke="#424c57" stroke-width="1.5"/><text x="480" y="318" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#18232f">e1: P</text>
<path d="M735 170L660 285" fill="none" stroke="#53677a" stroke-width="2" marker-end="url(#arrow)"/><text x="585" y="218" font-family="system-ui, sans-serif" font-size="17" fill="#334a60">fn · depth 0</text>
<path d="M845 170L900 210" fill="none" stroke="#53677a" stroke-width="2" marker-end="url(#arrow)"/><text x="872" y="190" font-family="system-ui, sans-serif" font-size="17" fill="#334a60">arg</text>
<path d="M855 254L820 285" fill="none" stroke="#53677a" stroke-width="2" marker-end="url(#arrow)"/><text x="725" y="265" font-family="system-ui, sans-serif" font-size="17" fill="#334a60">body · +1</text>
<path d="M955 254L1010 290" fill="none" stroke="#53677a" stroke-width="2" marker-end="url(#arrow)"/><text x="985" y="270" font-family="system-ui, sans-serif" font-size="17" fill="#334a60">domain · +0</text>
<rect x="700" y="126" width="180" height="44" rx="5" fill="#fff" stroke="#424c57" stroke-width="1.5"/><text x="790" y="154" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#18232f">e4: app</text><rect x="825" y="210" width="160" height="44" rx="5" fill="#fff" stroke="#424c57" stroke-width="1.5"/><text x="905" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#18232f">e3: lam</text><rect x="585" y="290" width="180" height="44" rx="5" fill="#fff" stroke="#424c57" stroke-width="1.5"/><text x="675" y="318" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#18232f">e0: bvar 1</text><rect x="785" y="290" width="180" height="44" rx="5" fill="#fff" stroke="#424c57" stroke-width="1.5"/><text x="875" y="318" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#18232f">e2: bvar 0</text><rect x="990" y="290" width="100" height="44" rx="5" fill="#fff" stroke="#424c57" stroke-width="1.5"/><text x="1040" y="318" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#18232f">e1: P</text>
<text x="36" y="382" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#18232f">Variable-pair certificates</text>
<text x="36" y="419" font-family="ui-monospace, monospace" font-size="18" fill="#18232f">source e0 ↔ target e0    depths [0, 0]</text><text x="650" y="419" font-family="system-ui, sans-serif" font-size="18" fill="#334a60">external reference · index increases by 1</text><text x="36" y="455" font-family="ui-monospace, monospace" font-size="18" fill="#18232f">source e0 ↔ target e2    depths [1, 1]</text><text x="650" y="455" font-family="system-ui, sans-serif" font-size="18" fill="#334a60">local reference · index unchanged</text>
<text x="36" y="495" font-family="system-ui, sans-serif" font-size="17" fill="#424c57">A shared storage node does not merge occurrence paths or binder owners.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="title description">
<title id="title">One typed storage row has two scope-dependent targets</title>
<desc id="description">In the kernel-checked dependent-let control, source type row 3, bvar one, refers to external p in a let value at local depth one, and to local x in a let body at depth two. Extending the external context by two maps the first to bvar three and preserves the second as bvar one. Both original occurrence paths and contexts remain distinct.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5a6470"/></marker></defs>
<rect width="1080" height="640" fill="#faf9f6"/>
<g font-family="system-ui,sans-serif" fill="#202832">
<text x="36" y="42" font-size="25" font-weight="600">A typed term needs distinct reference targets</text>
<text x="36" y="76" font-size="18" fill="#425466">Kernel-checked authored control · original [p] → consumer [p, f, guard]</text>
<text x="36" y="126" font-family="ui-monospace,monospace" font-size="19">∀ x : Nat, (let y := p; x + y) = (let y := p; x + y)</text>
<text x="36" y="161" font-size="17" fill="#425466">Selected input: f · external context extension +2 · no change to local binders</text>
<text x="60" y="226" font-size="21" font-weight="600">Original producer type</text>
<text x="710" y="226" font-size="21" font-weight="600">Type in consumer context</text>
<path d="M355 355C480 355 480 288 690 288" fill="none" stroke="#5a6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M355 365C480 365 480 418 690 418" fill="none" stroke="#5a6470" stroke-width="2" marker-end="url(#arrow)"/>
<text x="415" y="265" font-size="18">let value · local depth 1</text>
<text x="415" y="292" font-family="ui-monospace,monospace" font-size="16">ports 1.1.1</text>
<text x="415" y="441" font-size="18">let body · local depth 2</text>
<text x="415" y="469" font-family="ui-monospace,monospace" font-size="16">ports 1.1.2.0.1</text>
<rect x="60" y="330" width="295" height="50" rx="4" fill="#fff" stroke="#5a6470" stroke-width="1.5"/><text x="207.5" y="362" text-anchor="middle" font-family="ui-monospace,monospace" font-size="21" fill="#202832">e3: bvar 1</text>
<rect x="710" y="263" width="300" height="50" rx="4" fill="#fff" stroke="#5a6470" stroke-width="1.5"/><text x="860" y="295" text-anchor="middle" font-family="ui-monospace,monospace" font-size="21" fill="#202832">e20: bvar 3</text>
<rect x="710" y="393" width="300" height="50" rx="4" fill="#fff" stroke="#5a6470" stroke-width="1.5"/><text x="860" y="425" text-anchor="middle" font-family="ui-monospace,monospace" font-size="21" fill="#202832">e3: bvar 1</text>
<text x="60" y="410" font-size="18">One stored row, two paths.</text>
<text x="710" y="344" font-size="18">External p shifts: 1 + 2 = 3.</text>
<text x="710" y="474" font-size="18">Local x stays at index 1.</text>
<path d="M36 510H1044" stroke="#c8ccd1"/>
<text x="36" y="546" font-size="18">The paired rows carry separate scope ranges; they do not identify the two references.</text>
<text x="36" y="580" font-family="ui-monospace,monospace" font-size="16" fill="#425466">Native owner 414791a7d2c595a01c96… · input 0:1 · query 1:1.2.2</text>
<text x="36" y="610" font-size="16" fill="#425466">Addresses and certificate are in native-sharing.json.gz. Row IDs belong to the native type table.</text>
</g></svg>

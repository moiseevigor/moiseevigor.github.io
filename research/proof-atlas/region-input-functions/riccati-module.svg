<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" role="group" aria-labelledby="title description" class="region-figure"><title id="title">Checked Riccati region function</title><desc id="description">Five supplied proof arguments feed seven original application results. Only the original data variables J and p remain in the context. Six arrows connect actual internal input uses. All input and result cards link to their exact compiled occurrences. Thirty other boundary positions retain their fixed source expressions.</desc><style>.region-figure{--paper:#fff;--ink:#202124;--muted:#535d68;--line:#697785;--accent:#285a86;--pale:#f2f5f8;--warn:#944326;background:var(--paper)}@media(prefers-color-scheme:dark){.region-figure{--paper:#191b1e;--ink:#eceff2;--muted:#b7c1ca;--line:#9aa9b7;--accent:#9bc8ef;--pale:#252a30;--warn:#f0b18e}}[data-theme="dark"] .region-figure{--paper:#191b1e;--ink:#eceff2;--muted:#b7c1ca;--line:#9aa9b7;--accent:#9bc8ef;--pale:#252a30;--warn:#f0b18e}text{fill:var(--ink)}.title{font:26px Georgia,serif}.math{font:18px Georgia,serif}.smallmath{font:16px Georgia,serif}.label{font:15px Arial,sans-serif}.caption{font:15px Arial,sans-serif;fill:var(--muted)}.box{fill:var(--paper);stroke:var(--line);stroke-width:1.4}.input{fill:var(--pale);stroke:var(--accent)}.module{fill:var(--pale);stroke:var(--line);stroke-dasharray:5 4}.wire{fill:none;stroke:var(--line);stroke-width:1.7}.bad{fill:var(--warn)}a:focus .box,a:hover .box{stroke:var(--accent);stroke-width:3}a:focus{outline:2px solid var(--accent)}.underline{text-decoration:underline}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="22" y="35" class="title">A checked function for the AM–GM region</text>
<text x="22" y="66" class="math">J : JacobiData, p : ℝ · five supplied proof arguments</text>
<text x="22" y="98" class="smallmath">A = |J.T₁(p)|,  B = |J.T₂(p)|,  D = J.d(p)·|J.s(p)|,  Q = J.z(p)·(1 − J.z(p))·J.Dz(p)</text>

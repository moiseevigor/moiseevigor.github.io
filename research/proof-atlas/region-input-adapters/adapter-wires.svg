<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="group" aria-labelledby="title desc"><title id="title">Explicit proof adapters at a Riccati transport step</title><desc id="desc">Two computed proofs have types A and C. Supplied adapter functions produce the equality and premise required by a chosen transport head. Ten links select original source connections and exact computed fields. Only the two adapted input wires are drawn; the complete application is shown below.</desc><style>svg{--paper:#fff;--ink:#202124;--muted:#535d68;--line:#697785;--pale:#f2f5f8;background:var(--paper)}@media(prefers-color-scheme:dark){svg{--paper:#191b1e;--ink:#eceff2;--muted:#b7c1ca;--line:#9aa9b7;--pale:#252a30}}text{fill:var(--ink)}.title{font:26px Georgia,serif}.math{font:20px Georgia,serif}.label{font:15px Arial,sans-serif}.caption{font:15px Arial,sans-serif;fill:var(--muted)}.box{fill:var(--pale);stroke:var(--line);stroke-width:1.4}.adapter{stroke-dasharray:6 4}.wire{fill:none;stroke:var(--line);stroke-width:1.8}a:focus .box,a:hover .box{stroke:var(--ink);stroke-width:3}a:focus{outline:2px solid var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="22" y="35" class="title">Additional inputs connect incompatible proof types</text>

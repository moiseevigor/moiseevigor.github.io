<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 880" role="group" aria-labelledby="title desc"><title id="title">Source-lambda reconstruction and dependent declaration order</title><desc id="desc">Three original Riccati lambdas are reconstructed by replacing two captured source values with independent inputs a and b. Complete original functions recover under specialization. A later input must precede an earlier port's derived definition in the declaration order, while original source port order remains intact. Ten keyboard links open original compiled expressions. Rewrites are derived syntax relations, not source-use edges.</desc><style>svg{--paper:#fff;--ink:#202124;--muted:#535d68;--line:#697785;--accent:#285a86;--pale:#f2f5f8;background:var(--paper)}@media(prefers-color-scheme:dark){svg{--paper:#191b1e;--ink:#eceff2;--muted:#b7c1ca;--line:#9aa9b7;--accent:#9bc8ef;--pale:#252a30}}text{fill:var(--ink)}.title{font:26px Georgia,serif}.math{font:21px Georgia,serif}.formula{font:18px Georgia,serif}.label{font:16px Arial,sans-serif}.caption{font:15px Arial,sans-serif;fill:var(--muted)}.box{fill:var(--pale);stroke:var(--line);stroke-width:1.4}.derived{stroke:var(--accent);stroke-dasharray:4 3}.rewrite{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:4 4}a:focus .box,a:hover .box{stroke:var(--accent);stroke-width:3}a:focus{outline:2px solid var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker></defs><text x="24" y="36" class="title">Rebuild source lambdas without adding proof adapters</text>

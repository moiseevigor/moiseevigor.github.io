# Overrides for local development — merged on top of _config.yml
# by: bundle exec jekyll serve --config _config.yml,_config.dev.yml

# Disable related-posts LSI (slow; needs classifier-reborn + GSL build)
lsi: false

# Show future-dated posts
future: true

# Render posts marked `published: false` as if they were published —
# only takes effect via the dev-config overlay, so production stays clean.
# Combined with --drafts on the CLI, dev sees everything.
unpublished: true

# Skip building tags/archives in dev (saves ~30s on large sites)
# Uncomment if tag generation slows the build noticeably:
# exclude:
#   - tag/

# Suppress external pings during local work
webmention:
  username: ""


# Show the SE(2) draft's PDF/source/data assets in the development preview.
defaults:
  - scope:
      path: "public/research/se2"
    values:
      published: true

# Re-include the two draft metadata filenames swallowed by the global JSON pattern.
# The development exclusion override below allows their parent directory.
include:
  - "public/data"
  - "se2-provenance.json"
  - "se2-ray-thresholds.json"

# Jekyll 3 applies parent-directory exclusions to each child file.
# Mirror the original excludes in development, allowing only the new draft folders.
exclude:
  - "*.json"
  - "*.log"
  - "bower_components"
  - "Gemfile*"
  - "LICENSE"
  - "node_modules"
  - "vendor"
  - "research/preferred-directions/lean/.lake"
  - "research/preferred-directions/lean/.github"
  - "_site_production"
  - "research/cosmic-web/data"
  - "research/preferred-directions/artifacts"

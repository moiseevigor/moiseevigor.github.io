# Dependencies
markdown:            kramdown
highlighter:         rouge

# Kramdown — protect math content from markdown processing
kramdown:
  math_engine: mathjax
  math_engine_opts: {}
  input: GFM

# Permalinks
#
permalink:           pretty
# Use of `relative_permalinks` ensures post links from the index work properly.
#relative_permalinks: true

# Publish posts whose date is in the future (matches _config.dev.yml; keeps
# scheduled posts in `_posts/` from being silently dropped by the build).
future:              true

# Setup
title:               Igor Moiseev
tagline:             'Applied mathematician, AI Enthusiast'
description:         'Notes on technology and intelligence.'
url:                 https://moiseevigor.github.io
baseurl:             ""
paginate:            5

github_repo_url:     https://github.com/moiseevigor/moiseevigor.github.io

disqus_shortname:    'moiseevigor-github'

webmention:
  username: moiseevigor.github.io

# About/contact
author:
  name:              Igor Moiseev
  url:               https://twitter.com/moiseev_igor
  email:             moiseev.igor@gmail.com

# Custom vars
version:             1.0.0

# Gems
plugins:
  - jekyll-sitemap
  - jekyll-mentions
  - jekyll-redirect-from
  - jekyll-paginate
  - jekyll-seo-tag

# https://jekyllrb.com/docs/variables/
# https://github.com/jekyll/jekyll/issues/2516
lsi: true

sass:
  style: compressed

exclude:
  - "*.json"
  - "*.log"
  - "bower_components"
  - "Gemfile*"
  - "LICENSE"
  - "node_modules"
  - "vendor"
  # Lean formalization build artifacts (mathlib checkout + oleans): never part
  # of the site, and watching them stalls regeneration.
  - "research/preferred-directions/lean/.lake"
  - "research/preferred-directions/lean/.github"
  # Production build output (docker compose 'build' service): must not be
  # re-ingested or watched by the dev server.
  - "_site_production"
  # Large gitignored research data/artifacts: never part of the site, and far
  # over the GitHub Pages 100MB-per-file limit. Without these, every build
  # copies ~5.6G into _site (and again into _site_production).
  - "research/cosmic-web/data"
  - "research/preferred-directions/artifacts"
  # Internal SE(2) review records and screenshots stay out of the public site.
  - "research/se2"
  - "research/se2-overview"

# Appendix pages: rendered at pinned permalinks but never part of site.posts,
# so they stay out of pagination, archives, and feeds; reachable via the
# series navigation inside the posts.
collections:
  appendices:
    output: true
  # Long-form mathematical articles (the "Articles" nav section): complete
  # statements and proofs behind the blog series, at pinned permalinks.
  articles:
    output: true

# Re-include precomputed data assets that the global "*.json" exclude swallows.
include:

<svg viewBox="0 0 220 148" xmlns="http://www.w3.org/2000/svg">
  <rect width="220" height="148" fill="#fff"/>
  <!-- The cosmic web: clusters (nodes) linked by filaments, over faint galaxies.
       One filament is highlighted as the sub-Riemannian geodesic spine. -->
  <!-- faint background galaxies -->
  <g fill="#1565c0" opacity="0.16">
    <circle cx="28" cy="70" r="1"/><circle cx="52" cy="26" r="1.1"/><circle cx="88" cy="52" r="0.9"/>
    <circle cx="128" cy="20" r="1"/><circle cx="164" cy="30" r="1.1"/><circle cx="200" cy="72" r="1"/>
    <circle cx="176" cy="92" r="0.9"/><circle cx="120" cy="100" r="1.1"/><circle cx="44" cy="128" r="1"/>
    <circle cx="86" cy="126" r="0.9"/><circle cx="20" cy="100" r="1"/><circle cx="198" cy="120" r="1.1"/>
    <circle cx="150" cy="66" r="0.9"/><circle cx="72" cy="82" r="1"/><circle cx="102" cy="42" r="0.9"/>
    <circle cx="140" cy="140" r="1"/><circle cx="64" cy="58" r="0.8"/><circle cx="184" cy="60" r="0.9"/>
  </g>
  <!-- filaments -->
  <g fill="none" stroke="#1565c0" stroke-linecap="round">
    <path d="M 38,44 Q 78,30 112,78" stroke-width="1.4" opacity="0.45"/>
    <path d="M 105,28 Q 118,50 112,78" stroke-width="1.6" opacity="0.55"/>
    <path d="M 183,50 Q 150,58 112,78" stroke-width="1.4" opacity="0.45"/>
    <path d="M 150,118 Q 128,100 112,78" stroke-width="1.4" opacity="0.5"/>
    <path d="M 38,44 Q 70,32 105,28" stroke-width="1.2" opacity="0.3"/>
    <path d="M 105,28 Q 148,34 183,50" stroke-width="1.2" opacity="0.3"/>
    <path d="M 38,44 Q 44,78 60,108" stroke-width="1.2" opacity="0.3"/>
    <path d="M 60,108 Q 105,120 150,118" stroke-width="1.2" opacity="0.3"/>
    <path d="M 183,50 Q 172,88 150,118" stroke-width="1.2" opacity="0.3"/>
  </g>
  <!-- highlighted geodesic spine -->
  <path d="M 60,108 Q 84,96 112,78" fill="none" stroke="#e65100" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
  <!-- nodes (clusters) -->
  <g fill="#1565c0">
    <circle cx="38" cy="44" r="3.2"/><circle cx="105" cy="28" r="3.6"/><circle cx="183" cy="50" r="3.2"/>
    <circle cx="150" cy="118" r="3.4"/><circle cx="112" cy="78" r="5"/>
  </g>
  <circle cx="60" cy="108" r="3.6" fill="#e65100"/>
</svg>

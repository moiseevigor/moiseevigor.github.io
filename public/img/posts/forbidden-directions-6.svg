<svg viewBox="0 0 220 148" xmlns="http://www.w3.org/2000/svg">
  <rect width="220" height="148" fill="#fff"/>
  <!-- The transition state: two nulls (a pair) merging into one degenerate null,
       read by the scale-crossover curve on the right. -->
  <!-- the pair, approaching along the axis -->
  <g stroke="#1565c0" stroke-width="1.1" fill="none" opacity="0.6">
    <path d="M 22,36 Q 46,58 70,36 M 22,112 Q 46,90 70,112"/>
    <path d="M 30,28 Q 46,52 62,28 M 30,120 Q 46,96 62,120"/>
  </g>
  <circle cx="46" cy="58" r="3" fill="#1565c0"/>
  <circle cx="46" cy="90" r="3" fill="#1565c0"/>
  <path d="M 46,64 L 46,72 M 46,84 L 46,76" stroke="#e65100" stroke-width="1.4" fill="none"/>
  <path d="M 46,72 l -3,-4 m 3,4 l 3,-4 M 46,76 l -3,4 m 3,4 l 3,-4" stroke="#e65100" stroke-width="0" fill="none"/>
  <path d="M 43,68 L 46,73 L 49,68 M 43,80 L 46,75 L 49,80" stroke="#e65100" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <text x="46" y="136" text-anchor="middle" font-family="'Source Sans 3',sans-serif" font-size="7.5" fill="#1565c0">pair, merging</text>
  <!-- the degenerate null -->
  <circle cx="104" cy="74" r="5.5" fill="#e65100"/>
  <circle cx="104" cy="74" r="10.5" fill="none" stroke="#e65100" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>
  <text x="104" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#e65100">Q=7</text>
  <!-- arrow between -->
  <path d="M 66,74 L 86,74" stroke="#5f6368" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 86,74 l -5,-3 M 86,74 l -5,3" stroke="#5f6368" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- the crossover curve: w4(r) step from 2 to 4 -->
  <g transform="translate(134,28)">
    <rect x="0" y="0" width="70" height="92" rx="3" fill="#1565c0" fill-opacity="0.05" stroke="#1565c0" stroke-width="1"/>
    <path d="M 8,72 L 30,72 C 40,72 42,24 52,24 L 62,24"
          fill="none" stroke="#e65100" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="8" y1="72" x2="62" y2="72" stroke="#1565c0" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.5"/>
    <line x1="8" y1="24" x2="62" y2="24" stroke="#1565c0" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.5"/>
    <text x="66" y="75" font-family="monospace" font-size="7" fill="#1565c0">2</text>
    <text x="66" y="27" font-family="monospace" font-size="7" fill="#1565c0">4</text>
    <text x="35" y="86" text-anchor="middle" font-family="'Source Sans 3',sans-serif" font-size="7" fill="#5f6368">separation, read from one point</text>
  </g>
</svg>

<svg viewBox="0 0 220 148" xmlns="http://www.w3.org/2000/svg">
  <rect width="220" height="148" fill="#fff"/>
  <!-- A magnetic field (dots), a charged particle looping (Larmor orbit), the enclosed
       flux shaded, and one magnetic null where the field vanishes. -->
  <!-- field: out-of-plane dots -->
  <g fill="#1565c0" opacity="0.30">
    <circle cx="40" cy="30" r="1.3"/><circle cx="80" cy="26" r="1.3"/><circle cx="120" cy="30" r="1.3"/>
    <circle cx="40" cy="70" r="1.3"/><circle cx="80" cy="70" r="1.3"/><circle cx="120" cy="70" r="1.3"/>
    <circle cx="40" cy="110" r="1.3"/><circle cx="80" cy="112" r="1.3"/><circle cx="120" cy="110" r="1.3"/>
  </g>
  <!-- Larmor loop with shaded enclosed flux -->
  <circle cx="80" cy="72" r="34" fill="#1565c0" fill-opacity="0.10" stroke="#1565c0" stroke-width="1.6"/>
  <!-- direction-of-travel arrowhead on the loop -->
  <path d="M 113,68 l -5,-4 M 113,68 l -6,3" stroke="#1565c0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle cx="114" cy="72" r="3" fill="#1565c0"/>
  <!-- "flux" label glyph in the loop -->
  <text x="80" y="77" text-anchor="middle" font-family="monospace" font-size="13" fill="#1565c0" opacity="0.75">&#934;</text>
  <!-- the magnetic null (field vanishes) -->
  <g stroke="#e65100" stroke-width="1.3" fill="none" opacity="0.9">
    <path d="M 176,72 l 14,0 M 183,65 l 0,14"/>
    <circle cx="183" cy="72" r="9" stroke-dasharray="2.5 2.5"/>
  </g>
  <circle cx="183" cy="72" r="2.6" fill="#e65100"/>
  <text x="183" y="103" text-anchor="middle" font-family="'Source Sans 3',sans-serif" font-size="8" fill="#e65100">null</text>
</svg>

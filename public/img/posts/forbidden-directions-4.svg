<svg viewBox="0 0 220 148" xmlns="http://www.w3.org/2000/svg">
  <rect width="220" height="148" fill="#fff"/>
  <!-- Finding magnetic nulls with a growth vector: an X-type null where the
       field vanishes and lines cross; the growth vector jumps 5 -> 6 there. -->
  <!-- separatrices crossing at the null -->
  <g stroke="#1565c0" stroke-width="1" stroke-dasharray="4 3" opacity="0.5">
    <path d="M 40,36 L 130,108"/><path d="M 40,108 L 130,36"/>
  </g>
  <!-- hyperbolic field lines around the saddle -->
  <g fill="none" stroke="#1565c0" stroke-width="1.4" stroke-linecap="round">
    <path d="M 52,40 Q 85,64 118,40"/>
    <path d="M 52,104 Q 85,80 118,104"/>
    <path d="M 46,46 Q 66,72 46,98"/>
    <path d="M 124,46 Q 104,72 124,98"/>
  </g>
  <!-- the null -->
  <circle cx="85" cy="72" r="9" fill="none" stroke="#e65100" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>
  <circle cx="85" cy="72" r="2.8" fill="#e65100"/>
  <text x="85" y="128" text-anchor="middle" font-family="'Source Sans 3',sans-serif" font-size="7.5" fill="#e65100">null</text>
  <!-- the growth-vector jump: the detector's signal -->
  <rect x="150" y="60" width="54" height="24" rx="4" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="1"/>
  <text x="177" y="76" text-anchor="middle" font-family="monospace" font-size="11" fill="#1565c0">Q 5&#8594;6</text>
</svg>

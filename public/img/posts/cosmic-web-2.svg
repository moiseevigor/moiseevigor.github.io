<svg viewBox="0 0 220 148" xmlns="http://www.w3.org/2000/svg">
  <rect width="220" height="148" fill="#fff"/>
  <!-- Two ways to see a filament: galaxies scattered along one filament, traced
       by two spines — the Hessian detector (blue) and the orientation lift (orange). -->
  <!-- galaxies along the filament (lower-left → upper-right), plus clutter -->
  <g fill="#1565c0" opacity="0.55">
    <circle cx="34" cy="112" r="2"/><circle cx="50" cy="104" r="2.3"/><circle cx="60" cy="112" r="1.8"/>
    <circle cx="74" cy="96" r="2.4"/><circle cx="84" cy="104" r="2"/><circle cx="96" cy="88" r="2.5"/>
    <circle cx="104" cy="96" r="1.9"/><circle cx="116" cy="80" r="2.4"/><circle cx="128" cy="86" r="2"/>
    <circle cx="138" cy="70" r="2.5"/><circle cx="150" cy="76" r="2"/><circle cx="162" cy="60" r="2.3"/>
    <circle cx="172" cy="66" r="1.9"/><circle cx="186" cy="52" r="2.2"/>
  </g>
  <g fill="#1565c0" opacity="0.28">
    <circle cx="66" cy="80" r="1.4"/><circle cx="120" cy="106" r="1.4"/>
    <circle cx="150" cy="96" r="1.4"/><circle cx="92" cy="68" r="1.4"/><circle cx="40" cy="86" r="1.3"/>
  </g>
  <!-- two traced spines -->
  <path d="M 32,110 Q 112,90 188,52" fill="none" stroke="#1565c0" stroke-width="2" opacity="0.9" stroke-linecap="round"/>
  <path d="M 32,110 Q 98,82 188,52" fill="none" stroke="#e65100" stroke-width="1.7" opacity="0.8" stroke-dasharray="5 3" stroke-linecap="round"/>
  <!-- endpoints -->
  <circle cx="32" cy="110" r="3" fill="#1a1a1a"/>
  <circle cx="188" cy="52" r="3" fill="#1a1a1a"/>
</svg>

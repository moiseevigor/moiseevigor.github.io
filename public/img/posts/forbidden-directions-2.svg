<svg viewBox="0 0 220 148" xmlns="http://www.w3.org/2000/svg">
  <rect width="220" height="148" fill="#fff"/>
  <!-- The magnetic contact geometry: a Larmor orbit (base circle) lifts to a
       Heisenberg helix — the swept area becomes height along the flux axis. -->
  <!-- base plane: the Larmor orbit seen in perspective -->
  <ellipse cx="66" cy="116" rx="34" ry="10" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- the helix lifting off it -->
  <path d="M 40,114 C 40,104 92,104 92,94 C 92,84 40,84 40,74 C 40,64 92,64 92,54 C 92,46 66,42 56,40"
        fill="none" stroke="#1565c0" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M 56,40 l 7,2 M 56,40 l 2,7" stroke="#1565c0" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  <!-- flux axis: height = enclosed area -->
  <line x1="152" y1="120" x2="152" y2="42" stroke="#e65100" stroke-width="1.3"/>
  <path d="M 152,42 l -4,7 M 152,42 l 4,7" stroke="#e65100" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <text x="160" y="54" font-family="monospace" font-size="12" fill="#e65100">&#934;</text>
  <text x="150" y="134" text-anchor="middle" font-family="'Source Sans 3',sans-serif" font-size="7" fill="#e65100">area &#8594; height</text>
</svg>

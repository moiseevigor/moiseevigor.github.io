<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 148" role="img" aria-labelledby="title desc">
<title id="title">Proof Atlas — geometry of a proof</title>
<desc id="desc">A small typed proof graph: one trunk forks into nested subarguments, one shared lemma feeds both subarguments, and two paths converge on a common conclusion.</desc>

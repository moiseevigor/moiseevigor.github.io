<svg viewBox="0 0 220 148" xmlns="http://www.w3.org/2000/svg">
  <rect width="220" height="148" fill="#fff"/>
  <!-- The inverse map: three observables (growth vector, moduli, abnormal
       stratum) feed a classifier — a confusion matrix, mostly diagonal, with
       one off-diagonal alias pair. -->

  <!-- the three-observable fingerprint, entering from the left -->
  <g font-family="'Source Sans 3',sans-serif" font-size="7" fill="#1565c0">
    <circle cx="24" cy="46" r="2.4" fill="#1565c0"/><text x="32" y="49">growth</text>
    <circle cx="24" cy="74" r="2.4" fill="#1565c0"/><text x="32" y="77">moduli</text>
    <circle cx="24" cy="102" r="2.4" fill="#1565c0"/><text x="32" y="105">abnormal</text>
  </g>
  <path d="M 78,74 L 96,74" stroke="#e65100" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 96,74 l -5,-3 M 96,74 l -5,3" stroke="#e65100" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- 3x3 confusion matrix: strong diagonal (correct), one faint alias off it -->
  <g stroke="#1565c0" stroke-width="0.9" opacity="0.5" fill="none">
    <rect x="104" y="42" width="66" height="66"/>
    <line x1="126" y1="42" x2="126" y2="108"/><line x1="148" y1="42" x2="148" y2="108"/>
    <line x1="104" y1="64" x2="170" y2="64"/><line x1="104" y1="86" x2="170" y2="86"/>
  </g>
  <g fill="#1565c0">
    <rect x="105" y="43" width="20" height="20" fill-opacity="0.85"/>
    <rect x="127" y="65" width="20" height="20" fill-opacity="0.85"/>
    <rect x="149" y="87" width="20" height="20" fill-opacity="0.85"/>
  </g>
  <!-- the aliasing pair: an off-diagonal cell the method confuses -->
  <rect x="149" y="43" width="20" height="20" fill="#e65100" fill-opacity="0.55"/>
  <text x="137" y="126" text-anchor="middle" font-family="'Source Sans 3',sans-serif" font-size="7.5" fill="#1565c0">classify &amp; alias</text>
</svg>
